# Render Blueprint. On render.com choose New -> Blueprint and pick this repository.
services:
  - type: web
    name: information-extractor
    runtime: python
    plan: free
    # NLTK models are downloaded at build time into ./nltk_data (= $NLTK_DATA), not committed to git.
    buildCommand: pip install -r requirements.txt && python setup_nltk.py
    # app/app.py imports "extractor" from its own folder, so gunicorn runs from app/.
    # One worker with 4 threads keeps a single copy of the NLTK models in the free plan's 512 MB.
    startCommand: gunicorn --chdir app app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NLTK_DATA
        value: /opt/render/project/src/nltk_data
